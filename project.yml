name: TrainOrRest
options:
  bundleIdPrefix: com.khanhnguyen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: QLUHW4PPRY
targets:
  TrainOrRest:
    type: application
    platform: iOS
    sources: [TrainOrRest]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: TrainOrRest/TrainOrRest.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: TrainOrRest/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "202608162047"
        NSHealthShareUsageDescription: >-
          TrainOrRest reads your Garmin workouts and wellness data from Apple
          Health to build and adapt your training plan.
        NSHealthUpdateUsageDescription: >-
          TrainOrRest writes selected workout and training data to Apple Health
          only when you choose to sync it, so your health record stays complete.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - com.khanhnguyen.TrainOrRest.refresh
  TrainOrRestTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TrainOrRestTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TrainOrRest
schemes:
  TrainOrRest:
    build:
      targets:
        TrainOrRest: all
        TrainOrRestTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [TrainOrRestTests]
